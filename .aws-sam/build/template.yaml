AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  EncryptPDFFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: EncryptPDF
      Architectures:
      - x86_64
      CodeUri: EncryptPDFFunction
      Handler: PDFEncry.lambda_handler
      Runtime: python3.13
      Timeout: 15
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
      Policies:
      - AmazonS3FullAccess
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket:
              Ref: PDFSourceBucket
            Events: s3:ObjectCreated:*
    Metadata:
      SamResourceId: EncryptPDFFunction
  PDFSourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: snowflamo1-pdf-bucket
  EncryptedPDFBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: snowflamo1-pdf-bucket-encrypted
